name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-x64:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build release
        run: msbuild SolarpunkTrainer.sln /m /p:Configuration=Release /p:Platform=x64
